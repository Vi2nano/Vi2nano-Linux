$terminal = kitty
$launcher = nwg-drawer

monitor=,preferred,auto,1

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = yes
    }
}

general {
    gaps_in = 5
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(6ee7b7ee) rgba(38bdf8ee) 45deg
    col.inactive_border = rgba(334155aa)
    layout = dwindle
}

decoration {
    rounding = 12
    blur {
        enabled = yes
        size = 6
        passes = 2
    }
    shadow {
        enabled = yes
        range = 12
        render_power = 3
        color = rgba(00000066)
    }
}

animations {
    enabled = yes
    bezier = smooth, 0.22, 1, 0.36, 1
    animation = windows, 1, 5, smooth
    animation = workspaces, 1, 5, smooth, slide
}

exec-once = waybar
exec-once = swaync
exec-once = nm-applet --indicator
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = gsettings set org.gnome.desktop.wm.preferences button-layout 'close,minimize,maximize:'

$mainMod = SUPER
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, SPACE, exec, $launcher
bind = $mainMod, Q, killactive
bind = $mainMod, V, togglefloating
bind = $mainMod, F, fullscreen
bind = $mainMod, L, exec, loginctl lock-session
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r
bind = $mainMod SHIFT, E, exit

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
